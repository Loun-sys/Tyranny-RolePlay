  <header class="admin-top"><a href="./">ТИРАНИЯ <span>МАСТЕРСКАЯ</span></a><div><b id="connection">ЗАЩИЩЁННОЕ СОЕДИНЕНИЕ</b><button id="reload">ОБНОВИТЬ</button></div></header>
  <main class="admin-shell">
    <aside class="roster"><header><small>ДЕЛА СЕРВЕРА</small><h1>Персонажи</h1><input id="character-search" placeholder="Поиск по имени"></header><div id="character-list"></div></aside>

    <h2 id="delete-character-title">Удалить персонажа?</h2>
    <p>Будут удалены <b id="delete-character-name"></b>, его инвентарь, деньги и личные ссылки. Это действие необратимо.</p>
    <label class="field">Введите точное имя персонажа<input id="delete-character-confirm-name" autocomplete="off"></label>
    <p id="delete-character-error" role="alert"></p>
    <div class="box-actions"><button class="dark-button" data-cancel-character-delete>ОТМЕНА</button><button id="delete-character-submit" class="dark-button danger" disabled>УДАЛИТЬ НАВСЕГДА</button></div>
